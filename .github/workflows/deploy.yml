name: 🚀 Deploy — SGI Immo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy → O2switch (FTP)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Récupérer le code ────────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. PHP 8.3 + Composer ──────────────────────────────────────────────
      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, zip, gd, fileinfo
          coverage: none

      - name: 📦 Composer install (prod)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # ── 3. Build des assets Tailwind/Vite ──────────────────────────────────
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🎨 npm install & build
        run: |
          npm ci
          npm run build

      # ── 4. Déploiement FTP ─────────────────────────────────────────────────
      # Envoie vendor/ + public/build/ + tout le code (sauf exclusions)
      - name: 📤 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: sgi-immo/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/.env.*
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.github/**
            **/Makefile

      # ── 5. Webhook → artisan migrate + optimize ────────────────────────────
      - name: 🗄️  Trigger deploy hook (migrations + optimize)
        run: |
          curl -f -s -o /dev/null -w "%{http_code}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            "${{ secrets.APP_URL }}/deploy.php" \
          | grep -q "200" && echo "✅ Hook OK" || echo "⚠️ Hook failed (check manually)"
