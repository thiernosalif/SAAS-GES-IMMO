name: 🚀 Deploy — SGI Immo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy → O2switch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Récupérer le code ────────────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. PHP 8.3 + Composer (vendor buildé en CI, pas sur le serveur) ────
      - name: 🐘 Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, bcmath, zip, gd, fileinfo
          coverage: none

      - name: 📦 Composer install (prod)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      # ── 3. Build des assets Tailwind/Vite ──────────────────────────────────
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🎨 npm install & build
        run: |
          npm ci
          npm run build

      # ── 4. Git pull sur le serveur ─────────────────────────────────────────
      - name: 📡 Git pull
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            git pull origin main
            echo "✅ Code updated"

      # ── 5. Upload vendor/ (buildé avec PHP 8.3 en CI) ──────────────────────
      - name: 📤 Upload vendor/
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "vendor"
          target: "${{ secrets.APP_PATH }}/"

      # ── 6. Upload public/build/ (assets compilés) ──────────────────────────
      - name: 📤 Upload public/build/
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build"
          target: "${{ secrets.APP_PATH }}/public/"

      # ── 7. Migrations + cache + storage ────────────────────────────────────
      - name: 🗄️  Migrate & optimize
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.APP_PATH }}
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            php artisan storage:link 2>/dev/null || true
            echo "✅ Deployed at $(date '+%Y-%m-%d %H:%M:%S')"
